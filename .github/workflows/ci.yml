name: ci

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]

jobs:
  host:
    name: host (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [test, test-asan, test-ubsan, test-debug, test-switch]
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gcc make
      - name: Build and test
        run: make ${{ matrix.mode }}

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang-tidy cppcheck
      - name: Generate compile database
        run: make compile_commands.json
      - name: clang-tidy (gating)
        run: make tidy
      - name: cppcheck (advisory)
        run: make cppcheck
      - name: GCC -fanalyzer (advisory)
        run: make analyzer

  coverage:
    name: coverage (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true  # advisory until noise floor is known
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gcc make gcovr
      - name: Build and run with coverage instrumentation
        run: make coverage
      - name: Upload HTML report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/host-coverage/*.html
          if-no-files-found: warn
          retention-days: 14

  valgrind:
    name: valgrind (memcheck shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # Memcheck wraps the unit suite (~772 cases post-M3). Sharded across
    # 4 parallel CI jobs via URBI_SHARD_INDEX/URBI_SHARD_TOTAL — runner.c
    # filters suites by (index % total). Each shard also runs the
    # non-wrapped test-integration + test-chk prerequisites; that's
    # acceptable redundancy (sub-minute) compared to the valgrind bulk.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      URBI_SHARD_TOTAL: 4
      URBI_SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gcc make valgrind
      - name: Build and run under memcheck
        run: make test-valgrind

  docs-check:
    name: docs-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install markdown tools
        run: npm install -g markdownlint-cli2@0.13 markdown-link-check@3.12
      - name: Run docs-check
        run: make docs-check

  version-sync:
    name: Version sync (manifest + README)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # need full tag history
      - name: Check version sync
        # No escape needed on a pull request any more.  The gate used to be
        # handed github.head_ref on the convention that a PR branch is named
        # for the tag-to-be, which is false for any branch named after its
        # work rather than its release.  The script anchors on
        # include/urbi/version.h whenever that is ahead of the newest git
        # tag, which is exactly the pre-tag window, and falls back to the
        # tag otherwise.
        run: make check-version-sync

  releasetest:
    name: releasetest (full local-parity sweep)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make clang clang-tools-18 clang-tidy-18 clang-tidy \
              cppcheck valgrind gcovr libclang-rt-18-dev
          npm install -g markdownlint-cli2@0.13 markdown-link-check@3.12
      - name: Run releasetest
        run: make releasetest
