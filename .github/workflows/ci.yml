name: ci

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]

jobs:
  host:
    name: host (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [test, test-asan, test-ubsan, test-debug, test-switch]
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gcc make
      - name: Build and test
        run: make ${{ matrix.mode }}

  cross:
    name: cross (${{ matrix.preset }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        preset: [arm-cortex-m0plus, arm-cortex-m4f, arm-cortex-m7, riscv32]
    steps:
      - uses: actions/checkout@v5
      - name: Install the xpack toolchains
        run: |
          sudo apt-get update && sudo apt-get install -y make xz-utils
          mkdir -p /opt/xpack
          case "${{ matrix.preset }}" in
            riscv32)
              curl -sSL -o /tmp/tc.tar.gz https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v15.2.0-1/xpack-riscv-none-elf-gcc-15.2.0-1-linux-x64.tar.gz ;;
            *)
              curl -sSL -o /tmp/tc.tar.gz https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v14.2.1-1.1/xpack-arm-none-eabi-gcc-14.2.1-1.1-linux-x64.tar.gz ;;
          esac
          tar -C /opt/xpack -xf /tmp/tc.tar.gz
          echo "/opt/xpack/$(ls /opt/xpack | head -1)/bin" >> "$GITHUB_PATH"
      - name: Cross-compile, full and bytecode-only, with the archive gate
        run: make cross-${{ matrix.preset }} cross-${{ matrix.preset }}-bytecode-only

  probe-32bit:
    name: 32-bit probes (Cortex-M4 under qemu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain and qemu
        run: |
          sudo apt-get update && sudo apt-get install -y make xz-utils qemu-system-arm
          mkdir -p /opt/xpack
          curl -sSL -o /tmp/tc.tar.gz https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v14.2.1-1.1/xpack-arm-none-eabi-gcc-14.2.1-1.1-linux-x64.tar.gz
          tar -C /opt/xpack -xf /tmp/tc.tar.gz
          echo "/opt/xpack/$(ls /opt/xpack | head -1)/bin" >> "$GITHUB_PATH"
      - name: Build and run the probes under qemu
        run: make test-probes-32bit

  cross-pico-repl:
    name: Pico demo firmware (RP2040, pico-sdk 2.2.0)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install the xpack toolchain and CMake
        run: |
          sudo apt-get update && sudo apt-get install -y make cmake xz-utils
          mkdir -p /opt/xpack
          curl -sSL -o /tmp/tc.tar.gz https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v14.2.1-1.1/xpack-arm-none-eabi-gcc-14.2.1-1.1-linux-x64.tar.gz
          tar -C /opt/xpack -xf /tmp/tc.tar.gz
          echo "/opt/xpack/$(ls /opt/xpack | head -1)/bin" >> "$GITHUB_PATH"
      # The same tag and layout the README names: the SDK one directory
      # above the repository, with only the TinyUSB submodule the demo uses.
      - name: Clone pico-sdk 2.2.0
        run: |
          git clone --depth 1 --branch 2.2.0 https://github.com/raspberrypi/pico-sdk.git ../tools/pico-sdk
          git -C ../tools/pico-sdk submodule update --init --depth 1 lib/tinyusb
      - name: Build the host urbi, the hosted Cortex-M0+ archive and the firmware
        run: make pico-repl-demo
      - name: Footprint
        run: |
          arm-none-eabi-size examples/pico/repl_demo/build/repl_demo.elf
          ls -l examples/pico/repl_demo/build/repl_demo.uf2
      - name: Keep the image
        uses: actions/upload-artifact@v4
        with:
          name: repl_demo-uf2
          path: examples/pico/repl_demo/build/repl_demo.uf2
          retention-days: 14

  cross-stm32f4:
    name: STM32F4 demo firmware (STM32F429I-DISC1, STM32CubeF4 v1.28.2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install the xpack toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y make xz-utils
          mkdir -p /opt/xpack
          curl -sSL -o /tmp/tc.tar.gz https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v14.2.1-1.1/xpack-arm-none-eabi-gcc-14.2.1-1.1-linux-x64.tar.gz
          tar -C /opt/xpack -xf /tmp/tc.tar.gz
          echo "/opt/xpack/$(ls /opt/xpack | head -1)/bin" >> "$GITHUB_PATH"
      # The HAL, CMSIS device and BSP trees are submodules of the Cube
      # repository: a sparse checkout alone leaves them empty, so each
      # one the demo needs is initialised by name.  Cloned beside the
      # repository, where the example's Makefile looks by default.
      - name: Clone STM32CubeF4 v1.28.2 (the subtrees the demo needs)
        run: |
          git clone --depth 1 --filter=blob:none --no-checkout --branch v1.28.2 \
              https://github.com/STMicroelectronics/STM32CubeF4.git ../tools/stm32cube-f4
          git -C ../tools/stm32cube-f4 sparse-checkout set --skip-checks \
              Drivers/STM32F4xx_HAL_Driver Drivers/BSP/STM32F429I-Discovery \
              Drivers/BSP/Components/ili9341 Drivers/BSP/Components/l3gd20 \
              Drivers/BSP/Components/Common Drivers/CMSIS/Device/ST/STM32F4xx \
              Drivers/CMSIS/Include Utilities/Fonts
          git -C ../tools/stm32cube-f4 checkout v1.28.2
          git -C ../tools/stm32cube-f4 submodule update --init --depth 1 \
              Drivers/STM32F4xx_HAL_Driver Drivers/CMSIS/Device/ST/STM32F4xx \
              Drivers/BSP/STM32F429I-Discovery Drivers/BSP/Components/ili9341 \
              Drivers/BSP/Components/l3gd20 Drivers/BSP/Components/Common
          test -f ../tools/stm32cube-f4/Drivers/STM32F4xx_HAL_Driver/Inc/stm32f4xx_hal.h
          test -f ../tools/stm32cube-f4/Drivers/CMSIS/Include/core_cm4.h
          test -f ../tools/stm32cube-f4/Utilities/Fonts/fonts.h
      - name: Build the host urbi, the freestanding Cortex-M4F archive and the firmware
        run: make stm32f4-mandelbrot
      - name: Host tests of the component
        run: make test-port-stm32f4
      - name: Footprint
        run: |
          arm-none-eabi-size examples/stm32f4/mandelbrot/build/mandelbrot.elf
          ls -l examples/stm32f4/mandelbrot/build/mandelbrot.bin
      - name: Keep the image
        uses: actions/upload-artifact@v4
        with:
          name: mandelbrot-bin
          path: examples/stm32f4/mandelbrot/build/mandelbrot.bin
          retention-days: 14

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang-tidy cppcheck
      - name: Generate compile database
        run: make compile_commands.json
      - name: clang-tidy (gating)
        run: make tidy
      - name: cppcheck (advisory)
        run: make cppcheck
      - name: GCC -fanalyzer (advisory)
        run: make analyzer

  coverage:
    name: coverage (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true  # advisory until noise floor is known
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gcc make gcovr
      - name: Build and run with coverage instrumentation
        run: make coverage
      - name: Upload HTML report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/host-coverage/*.html
          if-no-files-found: warn
          retention-days: 14

  valgrind:
    name: valgrind (memcheck shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # Memcheck wraps the unit suite (~772 cases post-M3). Sharded across
    # 4 parallel CI jobs via URBI_SHARD_INDEX/URBI_SHARD_TOTAL — runner.c
    # filters suites by (index % total). Each shard also runs the
    # non-wrapped test-integration + test-chk prerequisites; that's
    # acceptable redundancy (sub-minute) compared to the valgrind bulk.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      URBI_SHARD_TOTAL: 4
      URBI_SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gcc make valgrind
      - name: Build and run under memcheck
        run: make test-valgrind

  docs-check:
    name: docs-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install markdown tools
        run: npm install -g markdownlint-cli2@0.13 markdown-link-check@3.12
      - name: Run docs-check
        run: make docs-check

  version-sync:
    name: Version sync (manifest + README)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # need full tag history
      - name: Check version sync
        # No escape needed on a pull request any more.  The gate used to be
        # handed github.head_ref on the convention that a PR branch is named
        # for the tag-to-be, which is false for any branch named after its
        # work rather than its release.  The script anchors on
        # include/urbi/version.h whenever that is ahead of the newest git
        # tag, which is exactly the pre-tag window, and falls back to the
        # tag otherwise.
        run: make check-version-sync

  releasetest:
    name: releasetest (full local-parity sweep)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make clang clang-tools-18 clang-tidy-18 clang-tidy \
              cppcheck valgrind gcovr libclang-rt-18-dev
          npm install -g markdownlint-cli2@0.13 markdown-link-check@3.12
      # releasetest runs cross-all, which needs every preset's compiler.
      - name: Install the xpack toolchains
        run: |
          mkdir -p /opt/xpack
          for url in \
              https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v14.2.1-1.1/xpack-arm-none-eabi-gcc-14.2.1-1.1-linux-x64.tar.gz \
              https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v15.2.0-1/xpack-riscv-none-elf-gcc-15.2.0-1-linux-x64.tar.gz; do
            curl -sSL -o /tmp/tc.tar.gz "$url"
            tar -C /opt/xpack -xf /tmp/tc.tar.gz
          done
          for d in /opt/xpack/*/bin; do echo "$d" >> "$GITHUB_PATH"; done
      - name: Run releasetest
        run: make releasetest
