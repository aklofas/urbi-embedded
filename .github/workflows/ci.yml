name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  host:
    name: host (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [test, test-asan, test-ubsan, test-debug, test-switch]
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gcc make
      - name: Build and test
        run: make ${{ matrix.mode }}

  cross-arm:
    name: cross-compile (ARM Cortex-M7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install cross toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi
      - name: Cross-compile
        run: make cross-arm
      - name: Inspect archive
        run: arm-none-eabi-ar t build/arm-cortex-m7/liburbi.a

  cross-riscv:
    name: cross-compile (RISC-V rv32imc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install cross toolchain
        run: |
          sudo apt-get update
          # Try multiple package names; succeed if any works.
          sudo apt-get install -y gcc-riscv64-unknown-elf \
            || sudo apt-get install -y gcc-riscv-none-elf \
            || (echo "RISC-V bare-metal toolchain unavailable; skipping cross-compile"; exit 0)
      - name: Cross-compile
        run: |
          if command -v riscv64-unknown-elf-gcc >/dev/null 2>&1; then
            make cross-riscv
          else
            echo "RISC-V bare-metal toolchain unavailable; skipping cross-compile"
            exit 0
          fi
      - name: Inspect archive
        run: |
          if [ -f build/riscv-rv32imc/liburbi.a ]; then
            riscv64-unknown-elf-ar t build/riscv-rv32imc/liburbi.a
          else
            echo "No archive produced; skipped"
          fi

  cross-esp32s3:
    name: cross-compile (ESP32-S3, Xtensa LX7)
    runs-on: ubuntu-latest
    # espressif/idf:v6.0.1 ships ESP-IDF + xtensa-esp-elf toolchain
    # pre-installed at /opt/esp/idf/. Version matches the pin in
    # components/urbi/idf_component.yml.
    container: espressif/idf:v6.0.1
    steps:
      - uses: actions/checkout@v5
      - name: Cross-compile (full mode)
        run: |
          . /opt/esp/idf/export.sh
          make cross-esp32s3-full
      - name: Cross-compile (bytecode-only mode)
        run: |
          . /opt/esp/idf/export.sh
          make cross-esp32s3-bytecode-only
      - name: Verify freestanding signature golden
        run: |
          . /opt/esp/idf/export.sh
          make test-cross-esp32s3-freestanding-golden
      - name: Inspect archives
        run: |
          . /opt/esp/idf/export.sh
          xtensa-esp-elf-ar t build/cross-esp32s3-full/liburbi.a
          xtensa-esp-elf-ar t build/cross-esp32s3-bytecode-only/liburbi.a

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang-tidy cppcheck
      - name: Generate compile database
        run: make compile_commands.json
      - name: clang-tidy (gating)
        run: make tidy
      - name: cppcheck (advisory)
        run: make cppcheck
      - name: GCC -fanalyzer (advisory)
        run: make analyzer

  coverage:
    name: coverage (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true  # advisory until noise floor is known
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gcc make gcovr
      - name: Build and run with coverage instrumentation
        run: make coverage
      - name: Upload HTML report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/host-coverage/*.html
          if-no-files-found: warn
          retention-days: 14

  valgrind:
    name: valgrind (memcheck shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # Memcheck wraps the unit suite (~772 cases post-M3). Sharded across
    # 4 parallel CI jobs via URBI_SHARD_INDEX/URBI_SHARD_TOTAL — runner.c
    # filters suites by (index % total). Each shard also runs the
    # non-wrapped test-integration + test-chk prerequisites; that's
    # acceptable redundancy (sub-minute) compared to the valgrind bulk.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      URBI_SHARD_TOTAL: 4
      URBI_SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gcc make valgrind
      - name: Build and run under memcheck
        run: make test-valgrind

  determinism-gate:
    name: determinism gate (3 presets × 100 runs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gcc make
      - name: Run determinism gate
        run: make test-determinism

  gc-pause-gate:
    name: gc pause gate (<1 ms per slice)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gcc make
      - name: Run GC pause gate
        run: make test-gc-pause

  docs-check:
    name: docs-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install markdown tools
        run: npm install -g markdownlint-cli2@0.13 markdown-link-check@3.12
      - name: Run docs-check
        run: make docs-check
