name: ci

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]

jobs:
  host:
    name: host (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [test, test-asan, test-ubsan, test-debug, test-switch, test-abi-freeze, test-trace, test-trace-compiled-out, test-perf-counters]
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gcc make
      - name: Build and test
        run: make ${{ matrix.mode }}

  tooling:
    name: tooling subsystem (trace + perf, REPL + determinism + host tooling)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gcc make gdb python3
      - name: trace + REPL combined build (session + Debug.trace taps)
        run: |
          make clean
          make URBI_ENABLE_REPL=1 \
            CFLAGS="-std=c99 -Wall -Wextra -Wpedantic -O1 -g -DURBI_TRACE=1 -DURBI_ENABLE_REPL=1" \
            test
      - name: determinism stays stable with URBI_TRACE=1
        run: make test-determinism-trace
      - name: perf-counters + REPL combined build (Debug.profile / Debug.gc seam)
        run: |
          make clean
          make URBI_ENABLE_REPL=1 \
            CFLAGS="-std=c99 -Wall -Wextra -Wpedantic -O1 -g -DURBI_PERF_COUNTERS=1 -DURBI_ENABLE_REPL=1" \
            test
      - name: determinism stays stable with URBI_PERF_COUNTERS=1
        run: make test-determinism-perf
      - name: host trace tooling — decoder unit test
        run: make test-trace-decode
      - name: host trace tooling — capture end-to-end
        run: make test-trace-capture
      - name: host trace tooling — GDB walkers smoke
        run: make test-gdb
      - name: memory debug — build + unit detectors
        run: make test-mem-debug
      - name: determinism stays stable with URBI_MEM_DEBUG=1
        run: make test-determinism-memdebug
      - name: memory debug — GDB owner-tag walkers
        run: make test-gdb-memdebug
      - name: ROS2 bridge (mock) tests
        run: make test-ros2
      - name: Robotics facet overlay tests
        run: make test-urobotics
      - name: Robotics overlay blob determinism
        run: make check-urobotics-determinism
      - name: facet<->ROS2 binding tests
        run: make test-ros-urobotics

  repl-multi-client-stress:
    name: repl multi-client stress (ASan, 100 trials)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gcc make
      - name: Build and run stress (100 teardown trials)
        run: |
          make clean
          make URBI_ENABLE_REPL=1 test-asan 2>&1 | tee /tmp/stress.log
          grep -q "four_clients_teardown_stress" /tmp/stress.log
          grep -q "PASS four_clients_teardown_stress" /tmp/stress.log
          ! grep -qE "AddressSanitizer|SIGABRT|SIGSEGV" /tmp/stress.log

  repl-security:
    name: repl security gates (W4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gcc make
      - name: Run REPL security gates (default build)
        run: |
          make clean
          make test-repl-security 2>&1 | tee /tmp/sec.log
          grep -qE "repl_security_bind_auth|repl_security_rate_limit|repl_security_compile_budget|repl_security_malformed|repl_security_output_isolation|repl_oom_paths" /tmp/sec.log
      - name: Run REPL security gates under ASan
        run: |
          make clean
          make test-asan 2>&1 | tee /tmp/sec-asan.log
          grep -q "repl_security_bind_auth" /tmp/sec-asan.log
          ! grep -qE "AddressSanitizer|SIGABRT|SIGSEGV" /tmp/sec-asan.log

  stdlib-bytecode-fresh:
    name: stdlib bytecode freshness (W5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gcc make
      - name: Build and check stdlib freshness
        run: make test-stdlib-bytecode-fresh

  dependency-pins:
    name: dependency pin static check (W5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check CI/docs dependency-pin sync
        run: make test-dependency-pins

  cross-arm:
    name: cross-compile (ARM Cortex-M7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install cross toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi
      - name: Cross-compile
        run: make cross-arm
      - name: Inspect archive
        run: arm-none-eabi-ar t build/arm-cortex-m7/liburbi.a

  cross-stm32f4:
    name: cross-compile (STM32F4 / Cortex-M4F)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install cross toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi
      - name: Cross-compile (full)
        run: make cross-stm32f4
      - name: Cross-compile (bytecode-only + freestanding gate)
        run: make cross-stm32f4-bytecode-only
      - name: Inspect archive
        run: arm-none-eabi-ar t build/arm-cortex-m4/liburbi.a

  cross-pico:
    name: cross-compile (RP2040 / Cortex-M0+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install cross toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi
      - name: Cross-compile (full)
        run: make cross-pico
      - name: Cross-compile (bytecode-only + freestanding gate)
        run: make cross-pico-bytecode-only
      - name: Freestanding signature golden
        run: make test-cross-pico-freestanding-golden
      - name: Inspect archive
        run: arm-none-eabi-ar t build/arm-cortex-m0plus/liburbi.a

  cross-pico-repl:
    name: cross-compile (RP2040 / cooperative REPL + example .elf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install cross toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi cmake
      - name: Clone pico-sdk
        run: |
          git clone --depth 1 --branch 2.2.0 \
              https://github.com/raspberrypi/pico-sdk.git ../tools/pico-sdk
          git -C ../tools/pico-sdk submodule update --init --depth 1
      - name: Cross-compile liburbi.a (cooperative REPL)
        run: make cross-pico-repl
      - name: Build repl_demo.elf
        run: make test-cross-pico-repl-elf
      - name: Inspect archive + ELF footprint
        run: |
          arm-none-eabi-size --totals build/arm-cortex-m0plus-repl/liburbi.a
          arm-none-eabi-size examples/pico/repl_demo/build/repl_demo.elf

  cross-riscv:
    name: cross-compile (RISC-V rv32imc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install cross toolchain (xpack riscv-none-elf-gcc)
        run: |
          # Ubuntu's gcc-riscv64-unknown-elf package ships the compiler
          # without a newlib sysroot, so `#include <string.h>` fails.
          # xpack's riscv-none-elf-gcc bundles newlib headers + libs.
          # The Makefile's `cross-riscv` target hardcodes the
          # `riscv64-unknown-elf-*` tool prefix; symlink xpack's tools
          # so the Makefile stays unchanged.
          XPACK_VER=15.2.0-1
          XPACK_URL="https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v${XPACK_VER}/xpack-riscv-none-elf-gcc-${XPACK_VER}-linux-x64.tar.gz"
          curl -fsSL "$XPACK_URL" -o /tmp/riscv-xpack.tar.gz
          sudo mkdir -p /opt/riscv-xpack
          sudo tar xf /tmp/riscv-xpack.tar.gz -C /opt/riscv-xpack --strip-components=1
          # Expose the xpack bin dir and create the riscv64-unknown-elf-* aliases.
          echo "/opt/riscv-xpack/bin" >> "$GITHUB_PATH"
          for tool in gcc ar nm objcopy objdump size strip; do
            sudo ln -sf "/opt/riscv-xpack/bin/riscv-none-elf-${tool}" \
                        "/opt/riscv-xpack/bin/riscv64-unknown-elf-${tool}"
          done
      - name: Cross-compile
        run: make cross-riscv
      - name: Inspect archive
        run: riscv64-unknown-elf-ar t build/riscv-rv32imc/liburbi.a

  cross-esp32s3:
    name: cross-compile (ESP32-S3, Xtensa LX7)
    runs-on: ubuntu-latest
    # espressif/idf:v6.0.1 ships ESP-IDF + xtensa-esp-elf toolchain
    # pre-installed at /opt/esp/idf/. Version matches the pin in
    # components/esp32-idf/idf_component.yml.
    container: espressif/idf:v6.0.1
    steps:
      - uses: actions/checkout@v5
      - name: Cross-compile (full mode)
        run: |
          . /opt/esp/idf/export.sh
          make cross-esp32s3-full
      - name: Cross-compile (bytecode-only mode)
        run: |
          . /opt/esp/idf/export.sh
          make cross-esp32s3-bytecode-only
      - name: Verify freestanding signature golden
        run: |
          . /opt/esp/idf/export.sh
          make test-cross-esp32s3-freestanding-golden
      - name: Inspect archives
        run: |
          . /opt/esp/idf/export.sh
          xtensa-esp-elf-ar t build/cross-esp32s3-full/liburbi.a
          xtensa-esp-elf-ar t build/cross-esp32s3-bytecode-only/liburbi.a

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang-tidy cppcheck
      - name: Generate compile database
        run: make compile_commands.json
      - name: clang-tidy (gating)
        run: make tidy
      - name: cppcheck (advisory)
        run: make cppcheck
      - name: GCC -fanalyzer (advisory)
        run: make analyzer

  coverage:
    name: coverage (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true  # advisory until noise floor is known
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gcc make gcovr
      - name: Build and run with coverage instrumentation
        run: make coverage
      - name: Upload HTML report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/host-coverage/*.html
          if-no-files-found: warn
          retention-days: 14

  valgrind:
    name: valgrind (memcheck shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # Memcheck wraps the unit suite (~772 cases post-M3). Sharded across
    # 4 parallel CI jobs via URBI_SHARD_INDEX/URBI_SHARD_TOTAL — runner.c
    # filters suites by (index % total). Each shard also runs the
    # non-wrapped test-integration + test-chk prerequisites; that's
    # acceptable redundancy (sub-minute) compared to the valgrind bulk.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      URBI_SHARD_TOTAL: 4
      URBI_SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gcc make valgrind
      - name: Build and run under memcheck
        run: make test-valgrind

  determinism-gate:
    name: determinism gate (3 presets × 100 runs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gcc make
      - name: Run determinism gate
        run: make test-determinism

  gc-pause-gate:
    name: gc pause gate (<1 ms per slice)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gcc make
      - name: Run GC pause gate
        run: make test-gc-pause

  docs-check:
    name: docs-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install markdown tools
        run: npm install -g markdownlint-cli2@0.13 markdown-link-check@3.12
      - name: Run docs-check
        run: make docs-check

  version-sync:
    name: Version sync (manifest + README)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # need full tag history
      - name: Check version sync
        run: make check-version-sync

  wire-freeze:
    name: wire-format freeze pin sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check wire-format freeze pin
        run: make test-wire-freeze
