name: ros-integration

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"   # nightly; the rcl backend is container-only and too heavy for per-push

jobs:
  ros-integration:
    name: ros2 jazzy integration (docker, copy-in)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Run containerized ROS2 integration harness
        run: make ros-integration

  esp32-eye-demo:
    name: ESP32-S3 eye_demo app (idf.py build)
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.1
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Pre-bake host tool
        # eye_demo/main/CMakeLists.txt calls tools/urbi-compile-stdlib at build
        # time to bake eye_demo.u into a C header; pre-build the host binary
        # before idf.py runs (same pattern as qemu-smoke.yml).
        run: make tools/urbi-compile-stdlib
      - name: Build eye_demo
        working-directory: examples/esp32/eye_demo
        run: |
          . /opt/esp/idf/export.sh
          idf.py build
      - name: Report binary size
        if: success()
        working-directory: examples/esp32/eye_demo
        run: |
          . /opt/esp/idf/export.sh
          # Use `idf.py size` (the version-agnostic front door that wraps
          # esp_idf_size) rather than hardcoding $IDF_PATH/tools/idf_size.py,
          # which moved/deprecated across ESP-IDF releases.
          idf.py size 2>/dev/null || ls -lh build/eye_demo.bin
          echo "esp32 eye_demo app: OK"
