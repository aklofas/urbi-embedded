# urbi-embedded docs — markdownlint ruleset.
#
# Rules not listed here fall back to markdownlint defaults.

# MD013 (line-length) — off; prose line-wrap is editorial, not mechanical.
MD013: false

# MD025 (single H1 at top) — on; Pandoc concatenation assumes this shape.
MD025:
  front_matter_title: ""

# MD040 (fenced code blocks must have a language tag) — on.
MD040: true

# MD033 (inline HTML) — allow the test-extraction comment `<!-- test: ... -->`.
MD033:
  allowed_elements: []
  # Comments pass regardless of this list; the rule is for tags like <div>.

# MD041 (first line must be H1) — on; pairs with MD025.
MD041: true

# MD024 (no duplicate headings) — allow same-name H3 headings in different
# version sections; CHANGELOG.md uses ### Language, ### Tests etc. per release.
# siblings_only: true was set in an earlier commit; the v0.10.13 W2 markdownlint
# commit (990699a2) only added the MD004 override below — its title narrative
# implied both rules changed at v0.10.13 but only MD004 did.
MD024:
  siblings_only: true

# Heading capitalization and style — unforced. Match context.
MD003: false

# Ordered-list increment style — unforced.
MD029: false

# MD004 (no-list-marker-mix) — disabled for CHANGELOG.md.
# The changelog wraps prose continuation lines starting with '+', which
# markdownlint parses as a list marker.  Disabling per-file avoids false
# positives while keeping the rule active elsewhere.
overrides:
  - files:
      - "CHANGELOG.md"
    rules:
      MD004: false
